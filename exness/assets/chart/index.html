<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    html, body, #chart { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #fff; font-family: -apple-system, BlinkMacSystemFont, Roboto, sans-serif; }
    #chart { touch-action: none; }
    #chart table > tr:first-child > td:nth-child(2),
    #chart table > tbody > tr:first-child > td:nth-child(2) { background: var(--pane-bg, #f8eaea); }
  </style>
</head>
<body>
  <div id="chart"></div>
  <script src="lightweight-charts-5.2.1.js"></script>
  <script src="chart.js"></script>
</body>
</html>
