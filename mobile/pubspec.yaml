name: trading_mobile
description: Android-first client for the Trading Demo application.
publish_to: 'none'
version: 1.0.0+202608262038

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.10.0
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  go_router: ^17.3.0
  signalr_hub: ^2.0.2
  webview_flutter: ^4.14.1

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  image: ^4.5.4
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/metatrader5_splash.png
    - assets/fonts/OFL-Roboto.txt
    - assets/fonts/LICENSE-RobotoCondensed-Apache-2.0.txt
  fonts:
    - family: Mt5Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: Mt5RobotoCondensed
      fonts:
        - asset: assets/fonts/RobotoCondensed-Regular.ttf
          weight: 400
        - asset: assets/fonts/RobotoCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/RobotoCondensed-Bold.ttf
          weight: 700
    - family: Mt5RobotoVariable
      fonts:
        - asset: assets/fonts/Roboto-Variable.ttf
    - family: Mt5RobotoCondensedVariable
      fonts:
        - asset: assets/fonts/RobotoCondensed-Variable.ttf
